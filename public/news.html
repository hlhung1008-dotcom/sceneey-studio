<script>


class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) { if (typeof o === 'function') o = o(this.state); Object.assign(this.state, o); }
  forceUpdate() {} }

var NEWS_URL = "/news.html", NEED = ["annc", "news"], SITE_DEF = { annc: {"on": true, "tag": "公告", "text": "Sceneey's Studio 新網站上線", "link": "news", "linkText": "看更多"} };
function siteCached(k) { try { var c = localStorage.getItem('site_' + k); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
var SITE = { annc: siteCached('annc') || SITE_DEF.annc, news: NEED.indexOf('news') >= 0 ? siteCached('news') : null, gallery: NEED.indexOf('gallery') >= 0 ? siteCached('gallery') : null };
document.addEventListener('alpine:init', function () { SITE = Alpine.reactive(SITE);
  NEED.forEach(function (k) { fetch('/api/site?k=' + k, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.data != null) { SITE[k] = d.data; try { localStorage.setItem('site_' + k, JSON.stringify(d.data)); } catch (e) {} } }).catch(function () {}); }); });
function siteVals(r) { var a = SITE.annc || SITE_DEF.annc, l = a.link || 'news';
  r.site = { annc: { tag: a.tag || '公告', text: a.text || '', hasLink: l !== 'none', linkText: a.linkText || '看更多', href: l === 'none' ? null : (l === 'news' ? NEWS_URL : l) } };
  if (!a.on) { r.anncOpen = false; r.scTop = '0px'; } return r; }


class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: '全部', open: null, annc: true }; }
  renderVals() {
    const COL = { '全部': '#3d3639', '公告': '#c27ba0', '維修': '#8a9bb0', '圖片': '#9b8ac9', '花絮': '#d9a76a' };
    const data = (SITE.news || [
      { id: '2026-11-site-launch', date: '2026.11.07', cat: '公告', pin: true, title: "Sceneey's Studio 新網站上線", body: '全新的 Sceneey\'s Studio 正式上線了！這裡會整理角色設定集、世界觀與作品紀錄，之後的更新與消息也會在這裡公告。' }
    ]).slice().sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const cur = this.state.cat;
    const cats = ['全部', '公告', '維修', '圖片', '花絮'].map((name) => {
      const on = name === cur;
      return { name, col: name === '全部' ? 'transparent' : COL[name], pressed: on ? 'true' : 'false',
        style: on ? 'background: #3d3639; border-color: #3d3639; color: #ffffff' : '',
        pick: () => this.setState({ cat: name }) };
    });
    const items = data.filter((n) => cur === '全部' || n.cat === cur).map((n) => ({
      ...n, col: COL[n.cat], open: this.state.open === n.id, arrow: this.state.open === n.id ? 'open' : '',
      toggle: () => this.setState({ open: this.state.open === n.id ? null : n.id })
    }));
    return { onScroll: (e) => { const el = e.currentTarget; const k = el.querySelector('.mini-kick'); if (!k) return; const d = el.scrollTop - (this._lastY || 0); this._lastY = el.scrollTop; const a = Math.max(-14, Math.min(14, -d * 0.6)); k.style.transform = 'rotate(' + a + 'deg)'; clearTimeout(this._kt); this._kt = setTimeout(() => { k.style.transform = 'rotate(0deg)'; }, 120); }, cats, items, empty: items.length === 0, anncOpen: this.state.annc, closeAnnc: () => this.setState({ annc: false }), scTop: this.state.annc ? '40px' : '0px' };
  }
}


document.addEventListener('alpine:init', function () {
  Alpine.data('dcApp', function () {
    var c = new Component({});
    c.state = Alpine.reactive(c.state);
    return { init: function () { if (c.componentDidMount) c.componentDidMount(); }, get v() { return siteVals(c.renderVals()); } };
  });
});

</script>
<script src="/js/alpine.min.js"></script>
</body>
</html>
