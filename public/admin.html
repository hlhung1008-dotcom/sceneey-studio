<style>
body{margin:0}
.news{--ink:#3d3639;--soft:#8a7d82;--rule:#ecdfe3;--paper:#fffdfb}
.news{background:var(--paper);padding-bottom:80px}
.nw-head{max-width:760px;margin:0 auto;padding-block:64px 28px;text-align:center}
.nw-eyebrow{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;color:var(--soft);letter-spacing:.06em}
.nw-title{margin:4px 0 10px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:64px;line-height:1;letter-spacing:.18em;color:var(--ink)}
.nw-sub{margin:0;font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.2em;color:var(--soft)}
.nw-filter{max-width:760px;margin:0 auto 18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.nw-filter button{display:inline-flex;align-items:center;gap:7px;font:500 14px/1 "Noto Serif TC",serif;letter-spacing:.12em;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .2s,border-color .2s}
.nw-filter button i{width:7px;height:7px;border-radius:50%}
.nw-filter button:hover{border-color:#d8c4cb}
.nw-filter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.nw-filter button:focus-visible,.nw-sum:focus-visible{outline:2px solid #c27ba0;outline-offset:3px}
.nw-list{list-style:none;max-width:760px;margin:0 auto;padding-top:0;padding-bottom:0;border-top:1px solid var(--rule)}
.nw-item{border-bottom:1px solid var(--rule)}
.nw-sum{width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:baseline;gap:18px;padding:22px 4px;cursor:pointer}
.nw-date{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;color:var(--soft);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.nw-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.nw-cat{align-self:flex-start;font:500 11px/1 "Noto Serif TC",serif;letter-spacing:.2em;padding:4px 10px;border-radius:999px;border:1px solid currentColor}
.nw-t{font-family:"Noto Serif TC",serif;font-weight:600;font-size:18px;line-height:1.5;color:var(--ink)}
.nw-pin{font:italic 500 14px "Cormorant Garamond",serif;color:#c27ba0;margin-left:8px}
.nw-arrow{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--soft);transition:transform .3s}
.nw-arrow.open{transform:rotate(90deg)}
.nw-body{padding:0 4px 26px 132px;font-family:"Noto Serif TC",serif;font-size:15px;line-height:2;color:#4f4649;white-space:pre-line}
.nw-body img{display:block;max-width:100%;border-radius:4px;margin-top:14px}
.nw-body a{color:#c27ba0}
.nw-empty{max-width:760px;margin:30px auto 0;text-align:center;font-family:"Noto Serif TC",serif;color:var(--soft);letter-spacing:.1em}

.mini-swing{animation:miniswing 3.6s ease-in-out infinite}
@keyframes miniswing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.mini-swing{animation:none}.mini-kick{transition:none!important}}
.pg-head{max-width:1100px;margin:0 auto;padding:64px 56px 30px;text-align:center}
.pg-eyebrow{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;color:#8a7d82;letter-spacing:.06em}
.pg-title{margin:4px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:64px;line-height:1;letter-spacing:.18em;color:#3d3639}
.pg-wrap{max-width:1000px;margin:0 auto;padding:0 56px}
.pg-banner{position:relative;height:320px;border-radius:6px;overflow:hidden;border-top:1px solid #ecdfe3;border-bottom:1px solid #ecdfe3}
.pg-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.62) sepia(.22) hue-rotate(-14deg) contrast(.93) brightness(1.06)}
.pg-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#f6c9d4,#e6dcf5 55%,#cfe6f1);mix-blend-mode:soft-light;opacity:.85}
.pg-cap{position:absolute;left:22px;bottom:16px;z-index:1;font:500 12px/1 "Noto Serif TC",serif;letter-spacing:.3em;color:#3d3639;background:rgba(255,253,251,.88);padding:7px 12px}
.pg-soon{display:flex;flex-direction:column;align-items:center;gap:10px;padding:64px 0 70px;text-align:center}
.pg-soon em{font:italic 500 30px/1 "Cormorant Garamond",Georgia,serif;color:#c27ba0;letter-spacing:.06em}
.pg-soon p{margin:0;font-family:"Noto Serif TC",serif;font-size:15px;letter-spacing:.18em;color:#6b5e63;line-height:2}
.pg-soon a{font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.15em;color:#3d3639;text-decoration:none;border-bottom:1px solid #c27ba0;padding-bottom:3px;margin-top:6px}
.gal-grid{columns:3 260px;column-gap:16px;padding:10px 0 40px}
.gal-grid button{display:block;width:100%;margin:0 0 16px;padding:0;border:0;background:#f7eef1;border-radius:6px;overflow:hidden;break-inside:avoid;cursor:zoom-in}
.gal-grid img{display:block;width:100%;height:auto;transition:transform .5s}
.gal-grid button:hover img{transform:scale(1.03)}
.gal-grid button:focus-visible,.pg-soon a:focus-visible{outline:2px solid #c27ba0;outline-offset:3px}

.pill{transition:transform .25s}
.pill > svg > path:first-of-type{transition:fill .25s}
.pill::after{content:"\2726";position:absolute;top:-10px;right:-2px;font-size:13px;line-height:1;color:#c27ba0;opacity:0;transform:scale(.3) rotate(-40deg);transition:opacity .25s,transform .35s cubic-bezier(.34,1.8,.5,1);pointer-events:none}
.pill:hover{animation:pillwob .55s ease-out forwards}
.pill:not([aria-current]):hover > svg > path:first-of-type{fill:#fbdbe4}
.pill:hover::after{opacity:1;transform:scale(1) rotate(0)}
@keyframes pillwob{0%{transform:none}30%{transform:rotate(-5deg) translateY(-4px) scale(1.06)}60%{transform:rotate(3deg) translateY(-2px) scale(1.03)}100%{transform:rotate(-2deg) translateY(-3px) scale(1.04)}}
@keyframes logobeat{0%,100%{transform:scale(1)}25%{transform:scale(1.28) rotate(-8deg)}50%{transform:scale(.92)}75%{transform:scale(1.15) rotate(6deg)}}
.pill:focus-visible{outline:2px dashed #4a4547;outline-offset:5px}

.gb{max-width:760px;margin:0 auto;padding:0 56px 20px;font-family:"Noto Serif TC",serif;color:#3d3639}
.gb-intro{text-align:center;margin:0 0 34px}

.gb-lk{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.12em;color:#8a5a73;background:#f7e6ee;border-radius:999px;padding:3px 9px}

<style>html,body{margin:0;background:#fffdfb;overflow:hidden}#dcroot{margin:0 auto}template{display:none}
#pl{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--pl-bg,#fffdfb);transition:opacity .5s ease,visibility .5s}
#pl.done,.pl-quick #pl.pl-wait,.pl-quick #pl:not(.pl-show){opacity:0;visibility:hidden}.pl-quick #pl:not(.pl-show){transition:none}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.pl-track{position:relative;width:300px;padding-top:52px}
.pl-bun{position:absolute;top:0;left:0;width:66px;margin-left:-33px;transform-origin:50% 100%;transition:left .2s ease-out;animation:plhop .34s ease-in-out infinite alternate;pointer-events:none}
.pl-bar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:5px;border:2px solid #4f494c;border-radius:12px 9px 13px 8px;background:#fff;box-shadow:2px 3px 0 #f6c9d4}
.pl-bar i{display:block;height:14px;border-radius:3px 4px 3px 4px;background:#f6edf0}
.pl-bar i.on{background:#f6c9d4;box-shadow:inset 0 0 0 1.5px #e597b1;animation:plpop .26s ease-out}
.pl-t{font-family:"La Belle Aurore",cursive;font-size:26px;line-height:1.2;color:#4f494c;display:flex;align-items:baseline;gap:10px}
.pl-t b{font:600 13px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;color:#c27ba0;font-variant-numeric:tabular-nums;min-width:3.2em}
@keyframes plpop{0%{transform:scaleY(.3)}60%{transform:scaleY(1.3)}100%{transform:none}}
@keyframes plhop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.pl-bun,.pl-bar i.on{animation:none}}
#pl{--pl-bg:#fffdfb}</style>
</head>

<script>
var MODE = "admin";

class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) { if (typeof o === 'function') o = o(this.state); Object.assign(this.state, o); }
  forceUpdate() {} }

var NEWS_URL = "/news", NEED = ["annc"], SITE_DEF = { annc: {"on": true, "tag": "公告", "text": "Sceneey's Studio 新網站上線", "link": "news", "linkText": "看更多"} };
function siteCached(k) { try { var c = localStorage.getItem('site_' + k); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
var SITE = { annc: siteCached('annc') || SITE_DEF.annc, news: NEED.indexOf('news') >= 0 ? siteCached('news') : null, gallery: NEED.indexOf('gallery') >= 0 ? siteCached('gallery') : null };
document.addEventListener('alpine:init', function () { SITE = Alpine.reactive(SITE);
  NEED.forEach(function (k) { fetch('/api/site?k=' + k, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.data != null) { SITE[k] = d.data; try { localStorage.setItem('site_' + k, JSON.stringify(d.data)); } catch (e) {} } }).catch(function () {}); }); });
function siteVals(r) { var a = SITE.annc || SITE_DEF.annc, l = a.link || 'news';
  r.site = { annc: { tag: a.tag || '公告', text: a.text || '', hasLink: l !== 'none', linkText: a.linkText || '看更多', href: l === 'none' ? null : (l === 'news' ? NEWS_URL : l) } };
  if (!a.on) { r.anncOpen = false; r.scTop = '0px'; } return r; }


class Component extends DCLogic {
  constructor(props) { super(props); this.state = { annc: true, lb: null, name: '', text: '', pw: '', priv: false, hp: '', sent: false, err: '', busy: false, msgs: [], loading: true, loadErr: '', unlocked: {}, pwIn: {}, pwBad: null, cf: null, replyId: null, replyText: '', key: '', loginPw: '', loginErr: '', admErr: '', tab: 'msgs', dA: null, dN: [], dG: [], dirtyA: false, dirtyG: false, nwF: null, glStatus: '', cmNote: '' }; }

  componentDidMount() {
    if (MODE === 'admin') { let k = ''; try { k = sessionStorage.getItem('gbk') || ''; } catch (_) {} if (k) { this.setState({ key: k }); this.load(k); } else this.setState({ loading: false }); }
    else this.load();
  }
  async api(body, key) {
    const h = { 'content-type': 'application/json' }; if (key) h['x-admin-key'] = key;
    const r = await fetch('/api/gb', body ? { method: 'POST', headers: h, body: JSON.stringify(body) } : { headers: h, cache: 'no-store' });
    let d = {}; try { d = await r.json(); } catch (_) {}
    if (!r.ok) { const e = new Error(d.error || '網路好像怪怪的，請稍後再試'); e.status = r.status; throw e; }
    return d;
  }
  async load(k, fresh) {
    if (k === undefined) k = this.state.key;
    this.setState({ loading: true, loadErr: '' });
    try {
      const d = await this.api(MODE === 'admin' ? { action: 'admin_list' } : null, MODE === 'admin' ? k : '');
      this.setState({ msgs: d.messages || [], loading: false });
      if (MODE === 'admin' && !this._siteLoaded) { this._siteLoaded = true; this.loadSite(); }
      if (MODE === 'admin' && fresh) { try { sessionStorage.setItem('gbk', k); } catch (_) {} }
    } catch (e) {
      if (MODE === 'admin' && (e.status === 401 || e.status === 503)) { try { sessionStorage.removeItem('gbk'); } catch (_) {} this.setState({ key: '', loginErr: e.message, loading: false }); }
      else this.setState({ loading: false, loadErr: e.message });
    }
  }
  async post(n, t, pv, p) {
    this.setState({ busy: true, err: '' });
    try { await this.api({ action: 'post', name: n, text: t, priv: pv, pw: pv ? p : '', website: this.state.hp }); this.setState({ name: '', text: '', pw: '', priv: false, sent: true, busy: false }); }
    catch (e) { this.setState({ err: e.message, busy: false, sent: false }); }
  }
  async unlock(id) {
    const pw = (this.state.pwIn[id] || '').trim(); if (!pw) { this.setState({ pwBad: id }); return; }
    try { const d = await this.api({ action: 'unlock', id: id, pw: pw }); this.setState({ unlocked: Object.assign({}, this.state.unlocked, { [id]: { text: d.text, reply: d.reply } }), pwBad: null }); }
    catch (e) { this.setState({ pwBad: id }); }
  }
  async adm(body, extra) {
    this.setState({ admErr: '' });
    try { await this.api(body, this.state.key); if (extra) this.setState(extra); await this.load(); }
    catch (e) { if (e.status === 401) { this.setState({ key: '', loginErr: e.message }); } else this.setState({ admErr: e.message }); }
  }

  async call(url, body) {
    const h = { 'content-type': 'application/json' }; if (this.state.key) h['x-admin-key'] = this.state.key;
    const r = await fetch(url, body ? { method: 'POST', headers: h, body: JSON.stringify(body) } : { headers: h, cache: 'no-store' });
    let d = {}; try { d = await r.json(); } catch (_) {}
    if (!r.ok) { const e = new Error(d.error || '網路好像怪怪的，請稍後再試'); e.status = r.status; throw e; }
    return d;
  }
  async loadSite() {
    try {
      const [a, n, g] = await Promise.all(['annc', 'news', 'gallery'].map((k) => this.call('/api/site?k=' + k)));
      this.setState({ dA: a.data, dN: n.data, dG: g.data, dirtyA: false, dirtyG: false });
    } catch (e) { this.setState({ admErr: '網站內容載入失敗：' + e.message }); }
  }
  async saveSite(k, data, extra) {
    this.setState({ admErr: '', cmNote: '儲存中…' });
    try {
      const d = await this.call('/api/site', { action: 'save', k: k, data: data });
      const map = { annc: 'dA', news: 'dN', gallery: 'dG' };
      this.setState(Object.assign({ [map[k]]: d.data, cmNote: '已儲存，網站已更新 ✓' }, extra || {}));
    } catch (e) { this.setState({ cmNote: '' }); if (e.status === 401) this.setState({ key: '', loginErr: e.message }); else this.setState({ admErr: e.message }); }
  }
  async shrink(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    let blob = null;
    for (const q of [0.86, 0.75, 0.62, 0.5]) {
      blob = await new Promise((r) => c.toBlob(r, 'image/webp', q));
      if (!blob || blob.type !== 'image/webp') blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q + 0.02));
      if (blob.size < 1700000) break;
    }
    const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
    return { type: blob.type, data: data };
  }
  async uploadFiles(input) {
    const files = Array.from(input.files || []).filter((f) => /^image\//.test(f.type)); if (!files.length) return;
    this.setState({ admErr: '', cmNote: '' });
    let done = 0;
    for (const f of files) {
      this.setState({ glStatus: '上傳中 ' + (done + 1) + ' / ' + files.length + '…' });
      try { const img = await this.shrink(f); const d = await this.call('/api/site', { action: 'upload', type: img.type, data: img.data });
        this.setState({ dG: (this.state.dG || []).concat([{ src: d.src, alt: f.name.replace(/\.[^.]+$/, '').slice(0, 60) }]), dirtyG: true }); done++; }
      catch (e) { this.setState({ admErr: '「' + f.name + '」上傳失敗：' + e.message }); }
    }
    input.value = '';
    this.setState({ glStatus: done ? '上傳了 ' + done + ' 張，記得按「儲存圖庫」' : '' });
  }
  renderVals() {

    const S = this.state, ADMIN = MODE === 'admin';
    const ask = (c) => this.setState({ cf: c });
    const listOn = !ADMIN || (!!S.key && S.tab === 'msgs');
    const gb = {
      name: S.name, text: S.text, count: S.text.length + ' / 300', sent: S.sent, err: S.err, busy: S.busy,
      privStr: S.priv ? 'true' : 'false', privOn: S.priv, pw: S.pw,
      onName: (e) => this.setState({ name: e.target.value, sent: false, err: '' }),
      onText: (e) => this.setState({ text: e.target.value, sent: false, err: '' }),
      onPw: (e) => this.setState({ pw: e.target.value, err: '' }),
      onHp: (e) => this.setState({ hp: e.target.value }),
      togglePriv: () => this.setState({ priv: !S.priv, pw: '', err: '' }),
      submit: (e) => { e.preventDefault(); if (S.busy) return; const n = S.name.trim(), t = S.text.trim(), p = S.pw.trim(), pv = S.priv;
        if (!n || !t) { this.setState({ err: '暱稱和留言都要填喔', sent: false }); return; }
        if (pv && p.length < 4) { this.setState({ err: '悄悄話需要設定 4–12 字的查看密碼喔', sent: false }); return; }
        ask({ title: pv ? '確定送出悄悄話？' : '確定送出留言？', body: pv ? '送出後就不能修改了。悄悄話只有 Sceneey 看得到，之後用你設的密碼打開。' : '送出後就不能修改了，Sceneey 看過後會公開在這裡。', ok: '送出', run: () => this.post(n, t, pv, p) }); },
      listOn: listOn,
      msgs: (listOn ? S.msgs : []).map((m) => {
        const u = S.unlocked[m.id]; const see = ADMIN || !!u; const locked = !!m.priv && !see;
        const text = u ? u.text : m.text; const reply = u ? u.reply : m.reply;
        return { id: m.id, name: m.name, date: m.date, priv: !!m.priv, rpriv: !!m.priv && !!reply, pending: !m.ok,
          showText: !locked, text: text || '', showReply: !locked && !!reply, reply: reply || '', needPw: locked,
          sealMsg: m.hasReply ? '這是一則悄悄話（Sceneey 已回覆），輸入密碼才能看' : '這是一則悄悄話，輸入密碼才能看',
          pwIn: S.pwIn[m.id] || '', pwBad: S.pwBad === m.id,
          onPwIn: (e) => this.setState({ pwIn: Object.assign({}, this.state.pwIn, { [m.id]: e.target.value }), pwBad: null }),
          unlock: () => this.unlock(m.id),
          admin: ADMIN, editing: ADMIN && S.replyId === m.id, replyLabel: m.reply ? '修改回覆' : '回覆', replyText: S.replyText,
          replyHint: m.priv ? '悄悄話的回覆會自動上鎖，只有留言者輸入密碼才看得到。' : '公開留言的回覆會公開顯示（只有悄悄話可以上鎖回覆）。',
          approve: () => ask({ title: '通過這則留言？', body: m.priv ? '通過後會出現在列表上，內容仍然上鎖。' : '通過後所有人都看得到這則留言。', ok: '通過', run: () => this.adm({ action: 'approve', id: m.id }) }),
          del: () => ask({ title: '確定要刪除嗎？', body: '「' + m.name + '」的這則留言' + (m.reply ? '和你的回覆' : '') + '會一起刪除，刪除後無法復原。', ok: '刪除', danger: true, run: () => this.adm({ action: 'delete', id: m.id }) }),
          startReply: () => this.setState({ replyId: m.id, replyText: m.reply || '' }),
          onReply: (e) => this.setState({ replyText: e.target.value }),
          saveReply: () => { const rt = this.state.replyText.trim(); if (!rt) return;
            ask({ title: m.priv ? '送出上鎖回覆？' : '送出回覆？', body: (m.priv ? '只有留言者輸入密碼才看得到這則回覆。' : '回覆會公開顯示在這則留言下面。') + (m.ok ? '' : '這則留言也會一起通過審核。'), ok: '送出回覆', run: () => this.adm({ action: 'reply', id: m.id, reply: rt }, { replyId: null }) }); },
          cancelReply: () => this.setState({ replyId: null }) };
      }),
      empty: listOn && (S.loading || S.msgs.length === 0),
      emptyMsg: S.loading ? '載入中…' : (S.loadErr || (ADMIN ? '目前沒有任何留言。' : '還沒有留言，來當第一個吧 ♡')),
      admErr: S.admErr, admErrOn: !!S.admErr,
      needLogin: ADMIN && !S.key, authed: ADMIN && !!S.key,
      loginPw: S.loginPw, loginErr: S.loginErr, loginErrOn: !!S.loginErr,
      onLoginPw: (e) => this.setState({ loginPw: e.target.value, loginErr: '' }),
      login: (e) => { e.preventDefault(); const k = S.loginPw; if (!k) return; this.setState({ key: k, loginPw: '' }); this.load(k, true); },
      logout: () => { try { sessionStorage.removeItem('gbk'); } catch (_) {} this._siteLoaded = false; this.setState({ key: '', msgs: [], tab: 'msgs', nwF: null }); },
      cfOpen: !!S.cf, cfTitle: S.cf ? S.cf.title : '', cfBody: S.cf ? S.cf.body : '', cfOk: S.cf ? S.cf.ok : '', cfOkClass: S.cf && S.cf.danger ? 'gb-btn cf-danger' : 'gb-btn',
      cfNo: () => this.setState({ cf: null }),
      cfYes: () => { const r = this.state.cf && this.state.cf.run; this.setState({ cf: null }); if (r) r(); }
    };
    

    if (ADMIN) {
      const authed = !!S.key, COL = { '公告': '#c27ba0', '維修': '#8a9bb0', '圖片': '#9b8ac9', '花絮': '#d9a76a' };
      const TABS = [['msgs', '留言'], ['annc', '公告列'], ['news', 'NEWS'], ['gal', 'GALLERY']];
      gb.tabs = TABS.map((t) => ({ label: t[1], sel: S.tab === t[0] ? 'true' : 'false', pick: () => this.setState({ tab: t[0], cmNote: '', admErr: '' }) }));
      gb.tabAnnc = authed && S.tab === 'annc'; gb.tabNews = authed && S.tab === 'news'; gb.tabGal = authed && S.tab === 'gal';
      gb.cmNote = S.cmNote; gb.cmNoteOn = !!S.cmNote;
      const a = S.dA || {}; const mode = a.link === 'none' ? 'none' : (!a.link || a.link === 'news' ? 'news' : 'custom');
      const edA = (p) => this.setState({ dA: Object.assign({}, this.state.dA, p), dirtyA: true, cmNote: '' });
      gb.an = { on: !!a.on, off: !a.on, tag: a.tag || '', text: a.text || '', mode: mode, custom: mode === 'custom', url: mode === 'custom' ? a.link : '', hasLink: mode !== 'none', linkText: a.linkText || '',
        dirtyMsg: S.dirtyA ? '有未儲存的變更' : '',
        toggleOn: () => edA({ on: !a.on }), onTag: (e) => edA({ tag: e.target.value }), onText: (e) => edA({ text: e.target.value }),
        onMode: (e) => { const v = e.target.value; edA({ link: v === 'custom' ? (mode === 'custom' ? a.link : 'https://') : v }); },
        onUrl: (e) => edA({ link: e.target.value }), onLinkText: (e) => edA({ linkText: e.target.value }),
        save: () => ask({ title: '儲存公告列？', body: a.on ? '儲存後，全站最上方的公告列會馬上更新。' : '儲存後，全站的公告列會隱藏起來。', ok: '儲存', run: () => this.saveSite('annc', this.state.dA, { dirtyA: false }) }) };
      const dN = S.dN || [], F = S.nwF;
      const edN = (p) => this.setState({ nwF: Object.assign({}, this.state.nwF, p) });
      const sorted = dN.slice().sort((x, y) => (y.pin ? 1 : 0) - (x.pin ? 1 : 0) || (x.date < y.date ? 1 : x.date > y.date ? -1 : 0));
      gb.nw = { count: dN.length, editing: !!F, f: F ? Object.assign({}, F, { dateIso: F.date.replace(/\./g, '-') }) : { title: '', dateIso: '', cat: '公告', pin: false, body: '' },
        saveLabel: F && F.isNew ? '發布公告' : '儲存修改',
        add: () => { const d = new Date(); const p = (x) => String(x).padStart(2, '0'); this.setState({ nwF: { isNew: true, id: '', title: '', date: d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()), cat: '公告', pin: false, body: '' }, cmNote: '', admErr: '' }); },
        onTitle: (e) => edN({ title: e.target.value }), onDate: (e) => { if (e.target.value) edN({ date: e.target.value.replace(/-/g, '.') }); },
        onCat: (e) => edN({ cat: e.target.value }), togglePin: () => edN({ pin: !this.state.nwF.pin }), onBody: (e) => edN({ body: e.target.value }),
        cancel: () => this.setState({ nwF: null }),
        save: () => { const f = this.state.nwF; if (!f.title.trim()) { this.setState({ admErr: '標題要填喔' }); return; }
          ask({ title: f.isNew ? '發布這則公告？' : '儲存修改？', body: f.isNew ? '發布後會馬上出現在 NEWS 頁。' : '修改會馬上更新到 NEWS 頁。', ok: f.isNew ? '發布' : '儲存',
            run: () => { const it = { id: f.id || ('n' + Date.now().toString(36)), date: f.date, cat: f.cat, pin: !!f.pin, title: f.title.trim(), body: f.body.trim() };
              const list = (this.state.dN || []).filter((x) => x.id !== it.id); list.push(it); this.saveSite('news', list, { nwF: null }); } }); },
        items: sorted.map((n) => ({ id: n.id, date: n.date, cat: n.cat, pin: !!n.pin, title: n.title, col: COL[n.cat] || '#3d3639',
          edit: () => this.setState({ nwF: Object.assign({}, n, { isNew: false }), cmNote: '', admErr: '' }),
          del: () => ask({ title: '刪除這則公告？', body: '「' + n.title + '」會從 NEWS 頁移除，刪除後無法復原。', ok: '刪除', danger: true, run: () => this.saveSite('news', (this.state.dN || []).filter((x) => x.id !== n.id)) }) })) };
      const dG = S.dG || [];
      const edG = (i, p) => { const l = this.state.dG.slice(); l[i] = Object.assign({}, l[i], p); this.setState({ dG: l, dirtyG: true, cmNote: '' }); };
      const mvG = (i, d) => { const l = this.state.dG.slice(), j = i + d; if (j < 0 || j >= l.length) return; const t = l[i]; l[i] = l[j]; l[j] = t; this.setState({ dG: l, dirtyG: true, cmNote: '' }); };
      gb.gl = { status: S.glStatus, dirtyMsg: S.dirtyG ? '有未儲存的變更（記得按儲存）' : '共 ' + dG.length + ' 張',
        items: dG.map((g, i) => ({ src: g.src, alt: g.alt, onAlt: (e) => edG(i, { alt: e.target.value }), up: () => mvG(i, -1), down: () => mvG(i, 1),
          del: () => ask({ title: '刪除這張圖？', body: '按「儲存圖庫」之後才會從 GALLERY 移除，移除後無法復原。', ok: '刪除', danger: true, run: () => this.setState({ dG: this.state.dG.filter((_, j) => j !== i), dirtyG: true, cmNote: '' }) }) })),
        onFiles: (e) => this.uploadFiles(e.target),
        save: () => ask({ title: '儲存圖庫？', body: 'GALLERY 頁會馬上更新成目前的內容與順序（共 ' + dG.length + ' 張）。', ok: '儲存', run: () => this.saveSite('gallery', this.state.dG, { dirtyG: false, glStatus: '' }) }) };
    }

    return { ...gb, onScroll: (e) => { const el = e.currentTarget; const k = el.querySelector('.mini-kick'); if (!k) return; const d = el.scrollTop - (this._lastY || 0); this._lastY = el.scrollTop; const a = Math.max(-14, Math.min(14, -d * 0.6)); k.style.transform = 'rotate(' + a + 'deg)'; clearTimeout(this._kt); this._kt = setTimeout(() => { k.style.transform = 'rotate(0deg)'; }, 120); }, anncOpen: this.state.annc, closeAnnc: () => this.setState({ annc: false }), scTop: this.state.annc ? '40px' : '0px' };
  }
}


document.addEventListener('alpine:init', function () {
  Alpine.data('dcApp', function () {
    var c = new Component({});
    c.state = Alpine.reactive(c.state);
    return { init: function () { if (c.componentDidMount) c.componentDidMount(); }, get v() { return siteVals(c.renderVals()); } };
  });
});

</script>
<script src="/js/alpine.min.js"></script>
</body>
