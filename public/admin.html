<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>後台管理｜Sceneey's Studio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
:root{--ink:#3d3639;--sub:#8a7d82;--line:#ecdfe3;--pink:#c27ba0;--soft:#fdf2f5;--bg:#fffdfb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.7 "Noto Serif TC",serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pink)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 22px;background:rgba(255,253,251,.96);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:18px;letter-spacing:.2em}
.top .sp{flex:1}
.anav{display:flex;flex-wrap:wrap;gap:6px}
.anav a{font-size:13px;letter-spacing:.1em;text-decoration:none;color:var(--sub);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}
.anav a:hover{color:var(--pink);border-color:var(--pink)}
.anav a[aria-current="page"]{background:#3d3639;border-color:#3d3639;color:#fff}
.lnk{font-size:13px;letter-spacing:.1em;text-decoration:none;color:var(--sub)}
.lnk:hover{color:var(--pink)}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;max-width:1240px;margin:0 auto;padding:22px}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.2em;color:var(--sub)}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f4ebee;cursor:pointer}
.cl li:hover{background:#fffafb}
.cl li[aria-current="true"]{background:var(--soft)}
.cl img,.cl .ph{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:#f3e8ec;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--pink)}
.cl .nm{flex:1;min-width:0}
.cl .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .nm small{font-size:11px;color:var(--sub)}
.cl .mv{display:flex;flex-direction:column}
.cl .mv button{border:0;background:none;cursor:pointer;color:var(--sub);font-size:11px;line-height:1;padding:3px 4px}
.cl .mv button:hover{color:var(--pink)}
.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:20px 22px;margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:15px;letter-spacing:.2em;display:flex;align-items:baseline;gap:10px}
.card h2 em{font:italic 500 14px "Cormorant Garamond",serif;color:var(--sub);letter-spacing:.06em}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:6px}
.f>span{font-size:12px;letter-spacing:.16em;color:var(--sub)}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;outline:none}
.in:focus{border-color:var(--pink)}
.in[readonly]{color:var(--sub);background:#f8f3f4}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--pink)}
.hint{font-size:12px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--ink);color:#fff;padding:10px 18px;font-size:13px;letter-spacing:.14em;cursor:pointer}
.btn:hover{background:var(--pink)}
.btn:disabled{opacity:.5;cursor:default}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 13px;font-size:12px;letter-spacing:.1em;cursor:pointer}
.ghost:hover{border-color:var(--pink);color:var(--pink)}
.danger:hover{border-color:#c0504d;color:#c0504d}
.up{position:relative;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.prev{position:relative;width:100%;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#f6eef1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
.prev img{width:100%;height:100%;object-fit:cover}
.prev.av{width:160px;aspect-ratio:1;border-radius:50%}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.rng{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.rng input{flex:1;accent-color:var(--pink)}
.st{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fffafb}
.gp{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.gp button{position:relative;border:2px solid transparent;border-radius:8px;padding:0;background:#f6eef1;cursor:pointer;aspect-ratio:1;overflow:hidden}
.gp img{width:100%;height:100%;object-fit:cover;display:block;opacity:.55;transition:opacity .2s}
.gp button[aria-pressed="true"]{border-color:var(--pink)}
.gp button[aria-pressed="true"] img{opacity:1}
.gp button[aria-pressed="true"]::after{content:"✓";position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--pink);color:#fff;font-size:12px;line-height:20px;text-align:center}
.tb{position:sticky;top:62px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;padding:8px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#fff}
.tb button,.tb label{border:1px solid transparent;background:none;border-radius:6px;padding:6px 9px;font-size:12px;cursor:pointer;letter-spacing:.06em}
.tb button:hover,.tb label:hover{border-color:var(--line);color:var(--pink)}
.tb .sep{width:1px;background:var(--line);margin:2px 4px}
.ed{min-height:360px;border:1px solid var(--line);border-radius:0 0 8px 8px;padding:20px 24px;outline:none;background:#fff;font:400 15px/2 "Noto Serif TC",serif;letter-spacing:.04em}
.ed:focus{border-color:#e3c9d2}
.ed:empty::before{content:"在這裡開始寫秘密設定與幕後花絮……";color:#c9bcc1}
.ed::after{content:"";display:block;clear:both}
.ed h2{font-size:22px;letter-spacing:.14em;margin:28px 0 10px;line-height:1.5}
.ed h3{font-size:17px;letter-spacing:.12em;margin:22px 0 8px;line-height:1.5;color:var(--pink)}
.ed p{margin:0 0 12px}
.ed blockquote{margin:16px 0;padding:6px 0 6px 18px;border-left:3px solid #f0c7d4;color:#6b5e63;font-style:italic}
.ed hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#e3c9d2,transparent);margin:26px 0}
.ed figure{margin:16px 0;position:relative;cursor:pointer}
.ed figure img{display:block;width:100%;height:auto;border-radius:8px}
.ed figcaption{margin-top:6px;font-size:12px;color:var(--sub);text-align:center;cursor:text;outline:none;min-height:1.5em}
.ed figcaption:empty::before{content:"圖片說明（可留空）";color:#d3c7cc}
.ed figure.b-center{width:62%;margin-left:auto;margin-right:auto}
.ed figure.b-left{float:left;width:44%;margin:6px 22px 10px 0}
.ed figure.b-right{float:right;width:44%;margin:6px 0 10px 22px}
.ed .b-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;cursor:pointer}
.ed .b-row figure{margin:0}
.ed .sel{outline:3px solid #f0c7d4;outline-offset:3px;border-radius:8px}
.fb{position:absolute;z-index:30;display:none;gap:4px;padding:6px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 8px 24px -10px rgba(74,54,66,.35)}
.fb button{border:0;background:none;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer}
.fb button:hover,.fb button[aria-pressed="true"]{background:var(--soft);color:var(--pink)}
.bar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px;background:rgba(255,253,251,.97);border-top:1px solid var(--line)}
.bar .sp{flex:1}
.msg{font-size:13px}
.msg.err{color:#c0504d}
.msg.ok{color:#5a9a6e}
[hidden]{display:none !important}
.login{max-width:360px;margin:80px auto;display:flex;flex-direction:column;gap:12px;padding:26px;border:1px solid var(--line);border-radius:12px;background:#fff}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(61,54,57,.35)}
.modal.on{display:flex}
.modal>div{width:min(420px,92vw);background:#fff;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
.modal b{font-size:16px;letter-spacing:.1em}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.chars{display:flex;flex-wrap:wrap;gap:8px}.chars label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;background:#fff}.chars input{accent-color:var(--pink)}.chars label:has(input:checked){border-color:var(--pink);background:var(--soft);color:var(--pink)}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
@media (max-width:860px){.wrap{grid-template-columns:1fr;padding:14px}.side{position:static;max-height:260px}.g2,.imgs{grid-template-columns:1fr}.tb{top:56px}.top{padding:12px 14px;flex-wrap:wrap}.anav{order:3;width:100%}}

.hub{max-width:980px;margin:0 auto;padding:22px 22px 120px;display:flex;flex-direction:column;gap:18px}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:11px;letter-spacing:.12em;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--pink)}
.pill.warn{background:#fff3e0;color:#b26a00}.pill.gray{background:#f3eff0;color:var(--sub)}
.msgc{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msgc .who{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}.msgc .who b{font-size:15px;letter-spacing:.08em}.msgc .who small{color:var(--sub);font-size:12px}
.msgc .txt{white-space:pre-wrap;line-height:1.8;font-size:14px}
.msgc textarea{min-height:70px}
.flt{display:flex;flex-wrap:wrap;gap:6px}.flt button{font:inherit;font-size:12.5px;letter-spacing:.1em;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--sub)}
.flt button[aria-pressed="true"]{background:#3d3639;color:#fff;border-color:#3d3639}
.nw{border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.nw .g3{display:grid;grid-template-columns:150px 120px 1fr;gap:10px;align-items:end}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gc{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.gc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#f6eef1}
.gc .bd{padding:10px;display:flex;flex-direction:column;gap:8px}
.tagc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.06em;border-radius:999px;padding:3px 8px;background:#f6eef1;color:var(--ink);border:0;cursor:pointer;font-family:inherit}
.tagc i{width:7px;height:7px;border-radius:50%}
.tagc:hover{background:#fbe3ec}
.scope{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub)}.scope label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;background:#fff}.scope label:has(input:checked){border-color:var(--pink);background:var(--soft);color:var(--pink)}.scope input{accent-color:var(--pink)}
.tgrow{display:grid;grid-template-columns:44px minmax(0,1fr) 150px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.tgrow input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.tgrow code{font-size:12px;color:var(--sub)}
.tgadd{display:grid;grid-template-columns:44px minmax(0,1fr) 150px auto;gap:10px;align-items:center;margin-top:12px}
.annprev{display:flex;align-items:center;gap:10px;font-size:13px;background:#fdf2f5;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.annprev b{font-size:11px;letter-spacing:.15em;padding:2px 8px;border-radius:999px;background:#f6c9d4}
@media (max-width:700px){.nw .g3{grid-template-columns:1fr 1fr}.nw .g3 .f:last-child{grid-column:1/-1}.tgrow,.tgadd{grid-template-columns:40px minmax(0,1fr) auto}.tgrow code,.tgadd .cid{grid-column:2/-1}.hub{padding:14px 14px 120px}}
</style>
</head>
<body>
<header class="top"><h1>後台管理</h1><nav class="anav" aria-label="管理頁面"><a href="/admin?tab=msgs">Q&amp;A 留言</a><a href="/admin?tab=annc">公告列</a><a href="/admin?tab=news">NEWS</a><a href="/admin?tab=gal">GALLERY</a><a href="/admin-chars">角色</a><a href="/admin-stories">故事</a><a href="/admin?tab=tags">標籤</a></nav><span class="sp"></span><a class="lnk" href="/" target="_blank" rel="noopener">看網站 ↗</a></header>
<div id="login" class="login" hidden>
  <b style="letter-spacing:.2em">管理密碼</b>
  <input id="pw" class="in" type="password" autocomplete="current-password" aria-label="管理密碼">
  <button id="pwgo" class="btn" type="button">登入</button>
  <span id="pwerr" class="msg err"></span>
</div>
<div id="app" hidden><div class="hub" id="main"></div></div>
<div class="bar" id="bar" hidden><span id="msg" class="msg" role="status"></span><span class="sp"></span><button class="btn" type="button" id="save">儲存</button></div>
<div class="modal" id="fmodal" role="dialog" aria-modal="true"><div><b id="fmt"></b><div id="fmb" style="display:flex;flex-direction:column;gap:12px"></div><div class="row"><button class="ghost" type="button" id="fmno">取消</button><button class="btn" type="button" id="fmok">確定</button></div></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div><b id="mt"></b><span id="mb" class="hint" style="font-size:13px"></span><div class="row"><button class="ghost" type="button" id="mno">取消</button><button class="btn" type="button" id="mok">確定</button></div></div></div>
<script>
(function(){
var KEY = ''; try { KEY = sessionStorage.getItem('gbk') || ''; } catch (e) {}
var TAGS = [], CH = [], GAL = [], NEWS = [], ANNC = null, MSGS = [], tab = 'msgs', dirty = false, mf = 'all', galDirty = false, blogDirty = false, orderDirty = false;
var CATS = ['公告', '維修', '圖片', '花絮'];
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function msg(t, k) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (k ? ' ' + k : ''); }
function ask(title, body, ok) { return new Promise(function (res) { $('mt').textContent = title; $('mb').textContent = body || ''; $('mok').textContent = ok || '確定'; $('modal').classList.add('on');
  var done = function (v) { $('modal').classList.remove('on'); $('mok').onclick = $('mno').onclick = null; res(v); }; $('mok').onclick = function () { done(true); }; $('mno').onclick = function () { done(false); }; }); }
async function call(body) {
  var h = { 'content-type': 'application/json' }; if (KEY) h['x-admin-key'] = KEY;
  var r = await fetch('/api/site', { method: 'POST', headers: h, body: JSON.stringify(body) }); var d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { var er = new Error(d.error || '網路好像怪怪的，請稍後再試'); er.status = r.status; throw er; } return d;
}
async function get(k) { var r = await fetch('/api/site?k=' + k, { cache: 'no-store' }); var d = await r.json(); if (!r.ok) throw new Error(d.error || '載入失敗'); return d.data; }
function setDirty(v) { dirty = v; if (v) msg('有未儲存的變更'); }
window.addEventListener('beforeunload', function (e) { if (dirty || galDirty || blogDirty || orderDirty) { e.preventDefault(); e.returnValue = ''; } });

function worlds() { return TAGS.filter(function (t) { return t.kind === 'world'; }); }
function plainTags(where) { return TAGS.filter(function (t) { return t.kind !== 'world' && (!where || !Array.isArray(t.on) || t.on.indexOf(where) >= 0); }); }
function tagLabel(id) { var t = TAGS.find(function (x) { return x.id === id; }); return t ? t.label : (id ? id : '獨立角色'); }
function ctagIds(c) { var a = (c.tags || []).slice(); if (c.collab && a.indexOf('collab') < 0) a.push('collab'); if (c.award && a.indexOf('award') < 0) a.push('award'); return a; }
function chips(name, sel, where) { return '<div class="chars">' + plainTags(where).map(function (t) { return '<label><input type="checkbox" data-' + name + '="' + esc(t.id) + '"' + (sel.indexOf(t.id) >= 0 ? ' checked' : '') + '><i style="width:8px;height:8px;border-radius:50%;background:' + esc(t.color) + '"></i>' + esc(t.label) + '</label>'; }).join('') + '</div>'; }
function worldSelect(v, attr) { return '<select class="in" ' + attr + '><option value="">獨立角色（不屬於任何世界觀）</option>' + worlds().map(function (t) { return '<option value="' + esc(t.id) + '"' + (v === t.id ? ' selected' : '') + '>' + esc(t.label) + '</option>'; }).join('') + '</select>'; }
function form(title, html) { return new Promise(function (res) { var md = $('fmodal'); $('fmt').textContent = title; $('fmb').innerHTML = html; md.classList.add('on'); var f1 = md.querySelector('input'); if (f1) f1.focus();
  var done = function (v) { md.classList.remove('on'); $('fmok').onclick = $('fmno').onclick = null; res(v); }; $('fmok').onclick = function () { var o = {}; md.querySelectorAll('[name]').forEach(function (x) { o[x.name] = x.value.trim(); }); done(o); }; $('fmno').onclick = function () { done(null); }; }); }

// ---------- login ----------
async function tryLogin(k) { KEY = k; try { await call({ action: 'check' }); try { sessionStorage.setItem('gbk', k); } catch (e) {} return true; } catch (e) { KEY = ''; $('pwerr').textContent = e.status === 401 ? '密碼不對喔' : e.message; return false; } }
$('pwgo').onclick = async function () { if (await tryLogin($('pw').value)) start(); };
$('pw').onkeydown = function (e) { if (e.key === 'Enter') $('pwgo').click(); };

// ---------- images ----------
async function shrink(file, max) {
  var bmp = await createImageBitmap(file); var s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  var c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  var blob = null; for (var q of [0.86, 0.75, 0.62, 0.5]) { blob = await new Promise(function (r) { c.toBlob(r, 'image/webp', q); }); if (!blob || blob.type !== 'image/webp') blob = await new Promise(function (r) { c.toBlob(r, 'image/jpeg', q + 0.02); }); if (blob.size < 1700000) break; }
  var data = await new Promise(function (r) { var fr = new FileReader(); fr.onload = function () { r(String(fr.result).split(',')[1]); }; fr.readAsDataURL(blob); });
  return { type: blob.type, data: data };
}
async function upload(file, max) { var im = await shrink(file, max); var d = await call({ action: 'upload', type: im.type, data: im.data }); return d.src; }


async function gb(body) {
  var h = { 'content-type': 'application/json' }; if (KEY) h['x-admin-key'] = KEY;
  var r = await fetch('/api/gb', { method: 'POST', headers: h, body: JSON.stringify(body) }); var d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { var er = new Error(d.error || '網路好像怪怪的，請稍後再試'); er.status = r.status; throw er; } return d;
}
function mark() { dirty = true; msg('有未儲存的變更'); }
function today() { var d = new Date(), p = function (x) { return String(x).padStart(2, '0'); }; return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()); }
var TABS = ['msgs', 'annc', 'news', 'gal', 'tags'];

// ---------- tabs ----------
function setNav() { document.querySelectorAll('.anav a').forEach(function (a) { var m = (a.getAttribute('href') || '').match(/tab=(\w+)/); if (m) a.setAttribute('aria-current', m[1] === tab ? 'page' : 'false'); }); }
document.querySelector('.anav').addEventListener('click', async function (e) {
  var a = e.target.closest('a'); if (!a) return; var m = (a.getAttribute('href') || '').match(/^\/admin\?tab=(\w+)/); if (!m || $('app').hidden) return;
  e.preventDefault(); if (m[1] === tab) return;
  if (dirty && !(await ask('放棄未儲存的變更？', '這個分頁有還沒儲存的修改。', '放棄並切換'))) return;
  go(m[1]);
});
function go(t) { tab = TABS.indexOf(t) >= 0 ? t : 'msgs'; dirty = false; msg(''); setNav(); try { history.replaceState(null, '', '/admin?tab=' + tab); } catch (e) {} render(); }
function render() {
  $('bar').hidden = tab === 'msgs';
  ({ msgs: rMsgs, annc: rAnnc, news: rNews, gal: rGal, tags: rTags })[tab]();
}

// ---------- Q&A messages ----------
function rMsgs() {
  var pend = MSGS.filter(function (m) { return !m.ok; }).length;
  var list = MSGS.filter(function (m) { return mf === 'all' || (mf === 'pend' ? !m.ok : mf === 'noreply' ? m.ok && !m.reply : m.priv); });
  $('main').innerHTML = '<section class="card"><h2>Q&amp;A 留言<em>Messages</em></h2><div class="row2"><div class="flt" id="mflt">' +
    [['all', '全部 ' + MSGS.length], ['pend', '待審核 ' + pend], ['noreply', '還沒回覆'], ['priv', '悄悄話']].map(function (x) { return '<button type="button" data-mf="' + x[0] + '" aria-pressed="' + (mf === x[0]) + '">' + x[1] + '</button>'; }).join('') +
    '</div><span class="sp" style="flex:1"></span><button class="ghost" type="button" id="mre">重新整理</button></div><span class="hint" style="display:block;margin-top:10px">新留言要「通過」才會出現在 Q&amp;A 頁；回覆後會自動通過。</span></section>' +
    (list.length ? list.map(function (m) { return '<div class="msgc" data-id="' + esc(m.id) + '"><div class="who"><b>' + esc(m.name) + '</b><small>' + esc(m.date) + '</small>' + (m.ok ? '' : '<span class="pill warn">待審核</span>') + (m.priv ? '<span class="pill gray">悄悄話</span>' : '') + (m.reply ? '<span class="pill">已回覆</span>' : '') + '</div>' +
      '<div class="txt">' + esc(m.text) + '</div><textarea class="in" maxlength="500" placeholder="回覆（最多 500 字）" data-rp>' + esc(m.reply) + '</textarea>' +
      '<div class="tools">' + (m.ok ? '' : '<button class="ghost" type="button" data-ma="approve">通過</button>') + '<button class="btn" type="button" data-ma="reply" style="padding:8px 16px">' + (m.reply ? '更新回覆' : '回覆') + '</button><button class="ghost danger" type="button" data-ma="delete">刪除</button></div></div>'; }).join('')
      : '<div class="empty">沒有留言</div>');
}
async function loadMsgs() { try { var d = await gb({ action: 'admin_list' }); MSGS = d.messages || []; } catch (e) { MSGS = []; msg(e.message, 'err'); } if (tab === 'msgs') rMsgs(); }

// ---------- announcement bar ----------
function annMode() { var l = ANNC.link || 'news'; return l === 'none' ? 'none' : (l === 'news' ? 'news' : 'custom'); }
function rAnnc() {
  var a = ANNC, mode = annMode();
  $('main').innerHTML = '<section class="card"><h2>公告列<em>Announcement</em></h2><div class="g2">' +
    '<label class="chk" style="grid-column:1/-1"><input type="checkbox" data-a="on"' + (a.on ? ' checked' : '') + '>在網站最上方顯示公告列</label>' +
    '<label class="f"><span>小標籤（最多 6 字）</span><input class="in" data-a="tag" maxlength="6" value="' + esc(a.tag) + '"></label>' +
    '<label class="f"><span>連結文字（最多 10 字）</span><input class="in" data-a="linkText" maxlength="10" value="' + esc(a.linkText) + '"></label>' +
    '<label class="f" style="grid-column:1/-1"><span>公告內容（最多 60 字）</span><input class="in" data-a="text" maxlength="60" value="' + esc(a.text) + '"></label>' +
    '<label class="f"><span>點了連到哪裡</span><select class="in" data-a="mode"><option value="news"' + (mode === 'news' ? ' selected' : '') + '>NEWS 頁</option><option value="custom"' + (mode === 'custom' ? ' selected' : '') + '>自訂網址</option><option value="none"' + (mode === 'none' ? ' selected' : '') + '>不放連結</option></select></label>' +
    '<label class="f"' + (mode === 'custom' ? '' : ' hidden') + ' id="aurl"><span>網址（https:// 或 / 開頭）</span><input class="in" data-a="url" value="' + esc(mode === 'custom' ? a.link : '') + '"></label></div>' +
    '<div class="annprev" style="margin-top:16px" id="aprev"></div></section>';
  aPrev();
}
function aPrev() { var a = ANNC, m = annMode(); $('aprev').innerHTML = '預覽：' + (a.on ? '' : '<span class="pill gray">目前關閉</span>') + '<b>' + esc(a.tag || '公告') + '</b><span>' + esc(a.text) + '</span>' + (m === 'none' ? '' : '<span style="color:var(--pink)">' + esc(a.linkText || '看更多') + ' →</span>'); }

// ---------- news ----------
function rNews() {
  $('main').innerHTML = '<section class="card"><h2>NEWS<em>News</em></h2><div class="row2"><span class="hint">共 ' + NEWS.length + ' 則。釘選的會排在最上面。</span><span style="flex:1"></span><button class="btn" type="button" id="nadd" style="padding:8px 16px">＋ 新增一則</button></div></section>' +
    NEWS.map(function (n, i) { return '<div class="nw"><div class="g3"><label class="f"><span>日期</span><input class="in" data-n="' + i + '.date" value="' + esc(n.date) + '" placeholder="2026.11.08"></label>' +
      '<label class="f"><span>分類</span><select class="in" data-n="' + i + '.cat">' + CATS.map(function (c) { return '<option' + (n.cat === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>' +
      '<label class="f"><span>標題</span><input class="in" data-n="' + i + '.title" maxlength="80" value="' + esc(n.title) + '"></label></div>' +
      '<label class="f"><span>內文（可換行）</span><textarea class="in" data-n="' + i + '.body" maxlength="3000" style="min-height:90px">' + esc(n.body) + '</textarea></label>' +
      '<div class="tools"><label class="chk"><input type="checkbox" data-n="' + i + '.pin"' + (n.pin ? ' checked' : '') + '>釘選</label><span style="flex:1"></span><button class="ghost" type="button" data-nm="' + i + ',-1">↑</button><button class="ghost" type="button" data-nm="' + i + ',1">↓</button><button class="ghost danger" type="button" data-nd="' + i + '">刪除</button></div></div>'; }).join('');
}

// ---------- gallery ----------
function chName(id) { var c = CH.find(function (x) { return x.id === id; }); return c ? c.name : null; }
function tagInfo(id) { var t = TAGS.find(function (x) { return x.id === id; }); return t; }
function gTags(g) { return (g.chars || []).map(function (id) { var n = chName(id); return n ? { k: 'c', id: id, label: n, col: '#c27ba0' } : null; }).filter(Boolean).concat((g.tags || []).map(function (id) { var t = tagInfo(id); return t ? { k: 't', id: id, label: t.label, col: t.color } : null; }).filter(Boolean)); }
function addSel(i) { return '<select class="in" data-gadd="' + i + '" style="padding:6px 8px;font-size:12.5px"><option value="">＋ 加標籤…</option><optgroup label="角色">' + CH.filter(function (c) { return !c.soon; }).map(function (c) { return '<option value="c:' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') + '</optgroup>' +
  '<optgroup label="世界觀">' + TAGS.filter(function (t) { return t.kind === 'world'; }).map(function (t) { return '<option value="t:' + esc(t.id) + '">' + esc(t.label) + '</option>'; }).join('') + '</optgroup><optgroup label="其他標籤">' + TAGS.filter(function (t) { return t.kind !== 'world' && (!Array.isArray(t.on) || t.on.indexOf('gallery') >= 0); }).map(function (t) { return '<option value="t:' + esc(t.id) + '">' + esc(t.label) + '</option>'; }).join('') + '</optgroup></select>'; }
function rGal() {
  $('main').innerHTML = '<section class="card"><h2>GALLERY<em>Gallery</em></h2><div class="row2"><span class="hint">共 ' + GAL.length + ' 張。標上角色的圖會出現在角色頁輪播；標上世界觀或其他標籤，藝廊頁就能用標籤篩選。</span><span style="flex:1"></span><label class="btn up" style="padding:8px 16px">＋ 上傳圖片<input type="file" accept="image/*" multiple id="gup" hidden></label></div></section>' +
    '<div class="gg">' + GAL.map(function (g, i) { return '<div class="gc"><img src="' + esc(g.src) + '" alt="" loading="lazy"><div class="bd"><input class="in" data-ga="' + i + '" maxlength="60" placeholder="圖片說明" value="' + esc(g.alt) + '">' +
      '<div class="row2">' + gTags(g).map(function (t) { return '<button type="button" class="tagc" data-grm="' + i + ':' + t.k + ':' + esc(t.id) + '" title="移除這個標籤"><i style="background:' + esc(t.col) + '"></i>' + esc(t.label) + ' ×</button>'; }).join('') + '</div>' + addSel(i) +
      '<div class="tools"><button class="ghost" type="button" data-gm="' + i + ',-1">←</button><button class="ghost" type="button" data-gm="' + i + ',1">→</button><span style="flex:1"></span><button class="ghost danger" type="button" data-gd="' + i + '">刪除</button></div></div></div>'; }).join('') + '</div>';
}

// ---------- tags ----------
function used(id) { var n = 0; CH.forEach(function (c) { if (c.world === id || (c.tags || []).indexOf(id) >= 0) n++; }); GAL.forEach(function (g) { if ((g.tags || []).indexOf(id) >= 0) n++; }); return n; }
function tagRows(kind) { return TAGS.map(function (t, i) { if ((t.kind === 'world') !== (kind === 'world')) return ''; return '<div class="tgrow"><input type="color" data-tc="' + i + '" value="' + esc(t.color) + '" aria-label="顏色"><input class="in" data-tl="' + i + '" maxlength="20" value="' + esc(t.label) + '"><code>代號：' + esc(t.id) + (t.isNew ? '（新）' : '') + '</code><button class="ghost danger" type="button" data-td="' + i + '">移除</button>' + (t.kind === 'world' ? '' : scopeHtml('data-ts="' + i + '"', t.on)) + '</div>'; }).join(''); }
var WHERE = [['chars', '角色'], ['stories', '故事'], ['gallery', '藝廊']];
function scopeHtml(attr, on) { on = Array.isArray(on) ? on : ['chars', 'stories', 'gallery']; return '<div class="scope">套用在：' + WHERE.map(function (w) { return '<label><input type="checkbox" ' + attr + ' value="' + w[0] + '"' + (on.indexOf(w[0]) >= 0 ? ' checked' : '') + '>' + w[1] + '</label>'; }).join('') + '</div>'; }
function tagAdd(kind) { return '<div class="tgadd" data-kind="' + kind + '"><input type="color" value="' + (kind === 'world' ? '#7d64a6' : '#8a7d82') + '" class="nc" aria-label="顏色"><input class="in nl" maxlength="20" placeholder="' + (kind === 'world' ? '新世界觀名稱' : '新標籤名稱（例：短篇、節日限定）') + '"><input class="in cid" maxlength="40" placeholder="代號（英文，例：holiday）"><button class="ghost" type="button" data-tadd="' + kind + '">＋ 新增</button>' + (kind === 'world' ? '' : scopeHtml('data-tsn', null)) + '</div>'; }
function rTags() {
  var chs = CH.filter(function (c) { return !c.soon; });
  $('main').innerHTML = '<section class="card"><h2>世界觀標籤<em>Worlds</em></h2><span class="hint">角色只能選一個世界觀；沒選的就是「獨立角色」。ARMENTARY、MAROPLIS、五界 有自己的世界觀頁面。</span>' + tagRows('world') + tagAdd('world') + '</section>' +
    '<section class="card"><h2>其他標籤<em>Tags</em></h2><span class="hint">每個標籤可以勾選要「套用在」角色、故事或藝廊；只勾藝廊的標籤，就只會出現在藝廊的標籤選單和 GALLERY 頁的篩選按鈕。</span>' + tagRows('tag') + tagAdd('tag') + '</section>' +
    '<section class="card"><h2>角色標籤<em>Characters</em></h2><span class="hint">每個角色都會自動成為一個標籤，用來標記故事和藝廊圖片。在 <a href="/admin-chars">角色</a> 分頁新增角色時就會自動建立。</span><div class="row2" style="margin-top:12px">' +
    chs.map(function (c) { return '<a class="tagc" href="/admin-chars" style="text-decoration:none"><i style="background:' + esc((tagInfo(c.world) || {}).color || '#c27ba0') + '"></i>' + esc(c.name) + '</a>'; }).join('') + '</div></section>';
}

// ---------- events ----------
var M = $('main');
M.addEventListener('input', function (e) {
  var t = e.target, d = t.dataset;
  if (d.a) { if (d.a === 'on') ANNC.on = t.checked; else if (d.a === 'url') ANNC.link = t.value.trim(); else if (d.a !== 'mode') ANNC[d.a] = t.value; mark(); aPrev(); }
  if (d.n) { var p = d.n.split('.'); NEWS[+p[0]][p[1]] = t.type === 'checkbox' ? t.checked : t.value; mark(); }
  if (d.ga != null) { GAL[+d.ga].alt = t.value; mark(); }
  if (d.tl != null) { TAGS[+d.tl].label = t.value; mark(); }
  if (d.tc != null) { TAGS[+d.tc].color = t.value; mark(); }
  if (d.ts != null) { var i0 = +d.ts; TAGS[i0].on = Array.from(M.querySelectorAll('[data-ts="' + i0 + '"]:checked')).map(function (x) { return x.value; }); mark(); }
});
M.addEventListener('change', async function (e) {
  var t = e.target, d = t.dataset;
  if (d.a === 'mode') { ANNC.link = t.value === 'custom' ? '' : t.value; mark(); rAnnc(); }
  if (d.gadd != null && t.value) { var g = GAL[+d.gadd], p = t.value.split(':'), arr = p[0] === 'c' ? (g.chars = g.chars || []) : (g.tags = g.tags || []); if (arr.indexOf(p[1]) < 0) arr.push(p[1]); mark(); rGal(); }
  if (t.id === 'gup' && t.files.length) { var fs = Array.from(t.files); t.value = ''; msg('上傳中…（' + fs.length + ' 張）');
    try { for (var f of fs) { var src = await upload(f, 2000); GAL.unshift({ src: src, alt: f.name.replace(/\.[^.]+$/, '').slice(0, 60), chars: [], tags: [] }); rGal(); } mark(); msg('已上傳，寫好說明、貼好標籤後記得按儲存', ''); } catch (er) { msg('上傳失敗：' + er.message, 'err'); } }
});
M.addEventListener('click', async function (e) {
  var b = e.target.closest('button'); if (!b) return; var d = b.dataset;
  if (d.mf) { mf = d.mf; rMsgs(); return; }
  if (b.id === 'mre') { msg('載入中…'); await loadMsgs(); msg(''); return; }
  if (d.ma) { var box = b.closest('.msgc'), id = box.dataset.id, m = MSGS.find(function (x) { return x.id === id; });
    if (d.ma === 'delete' && !(await ask('刪除這則留言？', '刪除後無法復原。', '刪除'))) return;
    b.disabled = true; try { await gb({ action: d.ma, id: id, reply: d.ma === 'reply' ? box.querySelector('[data-rp]').value : undefined });
      if (d.ma === 'delete') MSGS = MSGS.filter(function (x) { return x.id !== id; }); else { m.ok = true; if (d.ma === 'reply') m.reply = box.querySelector('[data-rp]').value.trim(); }
      rMsgs(); } catch (er) { b.disabled = false; alert(er.message); } return; }
  if (b.id === 'nadd') { NEWS.unshift({ id: 'n' + Date.now().toString(36), date: today(), cat: '公告', pin: false, title: '', body: '' }); mark(); rNews(); return; }
  if (d.nm) { var q = d.nm.split(','), a = +q[0], c = a + (+q[1]); if (c < 0 || c >= NEWS.length) return; var x = NEWS[a]; NEWS[a] = NEWS[c]; NEWS[c] = x; mark(); rNews(); return; }
  if (d.nd != null) { if (!(await ask('刪除這則 NEWS？', NEWS[+d.nd].title || '（未命名）', '刪除'))) return; NEWS.splice(+d.nd, 1); mark(); rNews(); return; }
  if (d.grm) { var r = d.grm.split(':'), g = GAL[+r[0]], arr2 = r[1] === 'c' ? g.chars : g.tags; var k = (arr2 || []).indexOf(r[2]); if (k >= 0) arr2.splice(k, 1); mark(); rGal(); return; }
  if (d.gm) { var q2 = d.gm.split(','), a2 = +q2[0], c2 = a2 + (+q2[1]); if (c2 < 0 || c2 >= GAL.length) return; var y = GAL[a2]; GAL[a2] = GAL[c2]; GAL[c2] = y; mark(); rGal(); return; }
  if (d.gd != null) { if (!(await ask('刪除這張圖片？', '按儲存後才會真的刪除。', '刪除'))) return; GAL.splice(+d.gd, 1); mark(); rGal(); return; }
  if (d.td != null) { var tg = TAGS[+d.td], u = used(tg.id); if (!(await ask('移除標籤「' + tg.label + '」？', u ? '目前有 ' + u + ' 個角色或圖片用到它，移除後它們就不會再顯示這個標籤。' : '目前沒有地方用到它。', '移除'))) return; TAGS.splice(+d.td, 1); mark(); rTags(); return; }
  if (d.tadd) { var row = b.closest('.tgadd'), label = row.querySelector('.nl').value.trim(), id = row.querySelector('.cid').value.trim().toLowerCase(), col = row.querySelector('.nc').value;
    if (!label) { msg('標籤名稱要填喔', 'err'); return; } if (!/^[a-z0-9-]{1,40}$/.test(id)) { msg('代號只能用小寫英文、數字和 -', 'err'); return; }
    if (TAGS.some(function (t) { return t.id === id; }) || CH.some(function (c) { return c.id === id; })) { msg('這個代號已經被角色或標籤用掉了', 'err'); return; }
    var on = Array.from(row.querySelectorAll('[data-tsn]:checked')).map(function (x) { return x.value; }); if (d.tadd !== 'world' && !on.length) { msg('至少要選一個套用位置', 'err'); return; }
    TAGS.push({ id: id, label: label, color: col, kind: d.tadd, on: on, isNew: true }); mark(); rTags(); return; }
});

// ---------- save ----------
$('save').onclick = async function () {
  var k = { annc: 'annc', news: 'news', gal: 'gallery', tags: 'tags' }[tab]; if (!k) return;
  if (!dirty) { msg('沒有需要儲存的變更'); return; }
  if (!(await ask('儲存變更？', '儲存後網站會馬上更新。', '儲存'))) return;
  $('save').disabled = true; msg('儲存中…');
  try {
    var data = k === 'annc' ? ANNC : k === 'news' ? NEWS : k === 'gallery' ? GAL : TAGS.map(function (t) { return { id: t.id, label: t.label, color: t.color, kind: t.kind, on: t.on }; });
    var d = await call({ action: 'save', k: k, data: data });
    if (k === 'annc') ANNC = d.data; else if (k === 'news') NEWS = d.data; else if (k === 'gallery') GAL = d.data; else TAGS = d.data;
    dirty = false; render(); msg('已儲存，網站已更新 ✓', 'ok');
  } catch (e) { if (e.status === 401) { msg('登入過期了，請重新整理後再登入', 'err'); try { sessionStorage.removeItem('gbk'); } catch (_) {} } else msg(e.message, 'err'); }
  $('save').disabled = false;
};
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function start() {
  $('login').hidden = true; $('app').hidden = false;
  var q = (location.search.match(/tab=(\w+)/) || [])[1]; tab = TABS.indexOf(q) >= 0 ? q : 'msgs'; setNav();
  $('main').innerHTML = '<div class="empty">載入中…</div>';
  try { var r = await Promise.all([get('annc'), get('news'), get('gallery'), get('tags'), get('chars')]); ANNC = r[0] || { on: false, tag: '公告', text: '', link: 'news', linkText: '看更多' }; NEWS = r[1] || []; GAL = r[2] || []; TAGS = r[3] || []; CH = r[4] || []; }
  catch (e) { $('main').innerHTML = '<div class="empty">載入失敗：' + esc(e.message) + '</div>'; return; }
  render(); loadMsgs();
}
(async function () { if (KEY && await tryLogin(KEY)) start(); else { $('login').hidden = false; $('pw').focus(); } })();
})();
</script>
</body>
</html>
