body{margin:0}
.news{--ink:#3d3639;--soft:#8a7d82;--rule:#ecdfe3;--paper:#fffdfb}
.news{background:var(--paper);padding-bottom:80px}
.nw-head{max-width:760px;margin:0 auto;padding-block:64px 28px;text-align:center}
.nw-eyebrow{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;color:var(--soft);letter-spacing:.06em}

.nw-sub{margin:0;font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.2em;color:var(--soft)}
.nw-filter{max-width:760px;margin:0 auto 18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.nw-filter button{display:inline-flex;align-items:center;gap:7px;font:500 14px/1 "Noto Serif TC",serif;letter-spacing:.12em;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .2s,border-color .2s}

.nw-filter button:focus-visible,.nw-sum:focus-visible{outline:2px solid #c27ba0;outline-offset:3px}
.nw-list{list-style:none;max-width:760px;margin:0 auto;padding-top:0;padding-bottom:0;border-top:1px solid var(--rule)}
.nw-item{border-bottom:1px solid var(--rule)}

.nw-empty{max-width:760px;margin:30px auto 0;text-align:center;font-family:"Noto Serif TC",serif;color:var(--soft);letter-spacing:.1em}

.cw{max-width:1180px;margin:0 auto;padding:0 56px}
.cw-lead{max-width:640px;margin:-6px auto 44px;text-align:center;font-family:"Noto Serif TC",serif;font-size:15px;line-height:2;letter-spacing:.08em;color:#6b5e63}
.wl{display:flex;flex-direction:column;gap:28px}
.wc{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;border:1px solid #ecdfe3;background:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.wc:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(61,54,57,.35)}
.wc-art{position:relative;min-height:300px;overflow:hidden}
.wc-art .wc-num{position:absolute;left:28px;top:22px;font:italic 500 15px "Cormorant Garamond",serif;letter-spacing:.1em;opacity:.8}
.wc-art .wc-big{position:absolute;left:24px;bottom:12px;font:600 76px/1 "Cormorant Garamond",serif;letter-spacing:.12em;opacity:.95}
.wc-body{padding:34px 36px 30px;display:flex;flex-direction:column;gap:14px;font-family:"Noto Serif TC",serif}
.wc-zh{font-size:24px;font-weight:600;letter-spacing:.2em;color:#3d3639;display:flex;align-items:baseline;gap:12px}
.wc-zh small{font:italic 500 14px "Cormorant Garamond",serif;letter-spacing:.08em;color:#8a7d82}
.wc-tag{font-size:14px;line-height:1.95;letter-spacing:.06em;color:#5c5054}
.wc-row{display:flex;align-items:center;gap:8px;margin-top:auto}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #ecdfe3;margin-left:-10px;display:flex;align-items:center;justify-content:center;font:600 16px "Noto Serif TC",serif;color:#fff}
.av:first-child{margin-left:0}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.wc-cnt{margin-left:12px;font-size:13px;letter-spacing:.12em;color:#8a7d82}
.wc-go{margin-left:auto;font:500 13px "Noto Serif TC",serif;letter-spacing:.2em;padding-bottom:3px;border-bottom:1px solid currentColor}
.indie-note{margin:46px auto 10px;max-width:760px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 28px;border:1px dashed #e4cdd6;border-radius:10px;font-family:"Noto Serif TC",serif;color:#5c5054;font-size:14px;letter-spacing:.06em}
.indie-note a{color:#3d3639;text-decoration:none;border-bottom:1px solid #c27ba0;padding-bottom:3px;white-space:nowrap}
/* world page */
.wh{position:relative;height:360px;overflow:hidden;display:flex;align-items:flex-end}
.wh.fade{height:500px}
.wh.fade .wh-in{padding-bottom:165px;z-index:2;text-shadow:0 2px 14px rgba(30,20,12,.45)}
.wh.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:200px;z-index:1;pointer-events:none;background:linear-gradient(rgba(255,253,251,0),rgba(255,253,251,.35) 30%,rgba(255,253,251,.85) 70%,#fffdfb)}
.wh-in{position:relative;max-width:1180px;width:100%;margin:0 auto;padding:0 56px 40px;display:flex;flex-direction:column;gap:10px}
.wh-crumb{font:500 12px "Noto Serif TC",serif;letter-spacing:.25em;opacity:.8}
.wh-crumb a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.wh-en{font:600 96px/1 "Cormorant Garamond",serif;letter-spacing:.14em}
.wh-zh{font:600 22px "Noto Serif TC",serif;letter-spacing:.35em}
.wh-tag{max-width:620px;font:400 15px/2 "Noto Serif TC",serif;letter-spacing:.06em;opacity:.92}
.sec{padding:54px 0 0}
.sec-h{display:flex;align-items:baseline;gap:14px;margin:0 0 22px}
.sec-h h2{margin:0;font:600 20px "Noto Serif TC",serif;letter-spacing:.3em;color:#3d3639}
.sec-h em{font:italic 500 16px "Cormorant Garamond",serif;color:#8a7d82;letter-spacing:.08em}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fact{border:1px solid #ecdfe3;border-radius:8px;background:#fff;padding:18px 18px 16px;font-family:"Noto Serif TC",serif}
.fact b{display:block;font:italic 500 13px "Cormorant Garamond",serif;letter-spacing:.12em;margin-bottom:8px}
.fact p{margin:0;font-size:14px;line-height:1.8;color:#3d3639;letter-spacing:.04em}
.places{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.place{padding:16px 16px 14px;border-radius:8px;font-family:"Noto Serif TC",serif}
.place b{display:block;font-size:15px;letter-spacing:.12em;color:#3d3639}
.place small{display:block;font:italic 500 13px "Cormorant Garamond",serif;color:#8a7d82;margin:2px 0 8px}
.place p{margin:0;font-size:13px;line-height:1.75;color:#5c5054}
.factions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fac{border:1px solid #ecdfe3;border-radius:10px;background:#fff;padding:22px 24px;font-family:"Noto Serif TC",serif}
.fac-layer{display:table;margin:2px 0 8px;padding:2px 10px;border:1px solid;border-radius:999px;font:500 11px "Noto Serif TC",serif;letter-spacing:.16em}
.fac h3{margin:0 0 4px;font:600 26px "Cormorant Garamond",serif;letter-spacing:.14em}
.fac p{margin:6px 0 14px;font-size:14px;line-height:1.85;color:#5c5054}
.fac .fac-who{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px "Noto Serif TC",serif;letter-spacing:.12em;padding:6px 12px;border-radius:999px;border:1px solid currentColor;text-decoration:none}
/* character cards */
.cg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.cc{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;font-family:"Noto Serif TC",serif}
.cc-img{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#f6eef1}
.cc-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cc:hover .cc-img img{transform:scale(1.04)}
.cc-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.cc-ph span{font:600 64px/1 "Noto Serif TC",serif;opacity:.9}
.cc-ph small{font:500 11px "Noto Serif TC",serif;letter-spacing:.3em;opacity:.75}

.cc-name{margin:12px 0 0;font-size:16px;font-weight:600;letter-spacing:.12em;color:#3d3639}
.cc-one{margin:5px 0 0;font-size:13px;line-height:1.7;color:#6b5e63}
.cc-era{margin-top:6px;font:italic 500 13px "Cormorant Garamond",serif;letter-spacing:.06em;color:#8a7d82}
.cc-soon .cc-img{background:#2b2620 url(/img/c/02de65fb8257451bdd7f58966fb5dac5.webp) center/cover no-repeat}
.cc-soon .cc-sil{display:none !important}
.cc-void .cc-img{background:#141114 !important}
.cc-soon .cc-ph span{text-shadow:0 2px 12px rgba(20,14,8,.6)}
.cc-soon .cc-ph span{color:#e7d8b6;font-size:72px}
.cc-soon .cc-ph small{color:#e7d8b6}
.cc-soon .cc-sil{position:absolute;left:50%;bottom:0;width:62%;height:78%;transform:translateX(-50%);background:radial-gradient(circle at 50% 22%,#1a1612 0 17%,transparent 17.5%),radial-gradient(ellipse at 50% 100%,#1a1612 0 60%,transparent 60.5%);opacity:.95}
.cg-round{display:flex;flex-wrap:wrap;gap:30px 44px}
.cg-round .cc{width:156px;align-items:center;text-align:center}
.cg-round .cc-img{width:156px;height:156px;aspect-ratio:auto;border-radius:50%;box-shadow:0 0 0 4px #fff,0 0 0 5px #ecdfe3}
.cg-round .cc-badge,.cg-round .cc-award{display:none}
.cg-round .cc-ph span{font-size:46px}
.cg-round .cc-ph small{font-size:9px;letter-spacing:.2em}
.cg-round .cc-soon .cc-ph span{font-size:50px}
.cg-round .cc-soon .cc-ph small{display:none}
.cg-round .cc-soon .cc-sil{width:74%;height:80%}
.cg-round .cc-one{font-size:12px}
.cc-weapon{font:italic 500 13px "Cormorant Garamond","Noto Serif TC",serif !important;letter-spacing:.2em;color:#a8854c !important}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 34px}
.filters button{display:inline-flex;align-items:center;gap:8px;font:500 13px/1 "Noto Serif TC",serif;letter-spacing:.14em;color:#3d3639;background:#fff;border:1px solid #ecdfe3;border-radius:999px;padding:10px 16px;cursor:pointer;transition:all .2s}
.filters button i{width:8px;height:8px;border-radius:50%}
.filters button:hover{border-color:#c27ba0}
.filters button[aria-pressed="true"]{background:#3d3639;border-color:#3d3639;color:#fff}
.cnt-line{text-align:center;margin:-18px 0 26px;font:italic 500 15px "Cormorant Garamond",serif;color:#8a7d82;letter-spacing:.08em}
/* character page */
.cp{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start;padding-top:44px}
.cp-art{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:#f6eef1}
.cp-art img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.cp-info{font-family:"Noto Serif TC",serif;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.cp-crumb{font:500 12px "Noto Serif TC",serif;letter-spacing:.25em;color:#8a7d82}
.cp-crumb a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.cp-name{margin:0;font-size:40px;font-weight:600;letter-spacing:.12em;color:#3d3639;line-height:1.25}
.cp-one{font-size:17px;line-height:1.9;color:#5c5054;letter-spacing:.06em;margin:0}
.cp-meta{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px 18px;margin:8px 0 0;padding:20px 0;border-top:1px solid #ecdfe3;border-bottom:1px solid #ecdfe3;font-size:14px}
.cp-meta dt{font:italic 500 15px "Cormorant Garamond",serif;color:#8a7d82;letter-spacing:.08em}
.cp-meta dd{margin:0;color:#3d3639;letter-spacing:.06em}
.cp-meta a{color:inherit}
.cp-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;margin-top:6px;font:500 14px "Noto Serif TC",serif;letter-spacing:.2em;color:#fff;background:#3d3639;border-radius:999px;padding:14px 26px;text-decoration:none;transition:background .2s}
.cp-cta:hover{background:#c27ba0}
.cp-note{font-size:12px;color:#8a7d82;letter-spacing:.06em}
</style>
<style>html,body{margin:0;background:#fffdfb;overflow:hidden}#dcroot{margin:0 auto}template{display:none}
#pl{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--pl-bg,#fffdfb);transition:opacity .5s ease,visibility .5s}
#pl.done{opacity:0;visibility:hidden}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.pl-track{position:relative;width:300px;padding-top:52px}
.pl-bun{position:absolute;top:0;left:0;width:66px;margin-left:-33px;transform-origin:50% 100%;transition:left .2s ease-out;animation:plhop .34s ease-in-out infinite alternate;pointer-events:none}
.pl-bar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:5px;border:2px solid #4f494c;border-radius:12px 9px 13px 8px;background:#fff;box-shadow:2px 3px 0 #f6c9d4}
.pl-bar i{display:block;height:14px;border-radius:3px 4px 3px 4px;background:#f6edf0}
.pl-bar i.on{background:#f6c9d4;box-shadow:inset 0 0 0 1.5px #e597b1;animation:plpop .26s ease-out}
.pl-t{font-family:"La Belle Aurore",cursive;font-size:26px;line-height:1.2;color:#4f494c;display:flex;align-items:baseline;gap:10px}
.pl-t b{font:600 13px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;color:#c27ba0;font-variant-numeric:tabular-nums;min-width:3.2em}
@keyframes plpop{0%{transform:scaleY(.3)}60%{transform:scaleY(1.3)}100%{transform:none}}
@keyframes plhop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.pl-bun,.pl-bar i.on{animation:none}}
#pl{--pl-bg:#fffdfb}</style>
