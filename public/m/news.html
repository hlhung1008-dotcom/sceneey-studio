<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px dashed #4a4547;outline-offset:3px}
.mini-swing{animation:miniswing 3.6s ease-in-out infinite}
@keyframes miniswing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pg-head{padding:34px 18px 18px;text-align:center}
.pg-eyebrow{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:14px;color:#8a7d82;letter-spacing:.06em}
.pg-title{margin:2px 0 0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:44px;line-height:1;letter-spacing:.14em;color:#3d3639}
.pg-banner{position:relative;margin:0 16px;height:190px;border-radius:6px;overflow:hidden}
.pg-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.62) sepia(.22) hue-rotate(-14deg) contrast(.93) brightness(1.06)}
.pg-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#f6c9d4,#e6dcf5 55%,#cfe6f1);mix-blend-mode:soft-light;opacity:.85}
.pg-cap{position:absolute;left:12px;bottom:10px;z-index:1;font:500 11px/1 "Noto Serif TC",serif;letter-spacing:.25em;color:#3d3639;background:rgba(255,253,251,.88);padding:6px 10px}
.pg-soon{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 22px 48px;text-align:center}
.pg-soon em{font:italic 500 24px/1 "Cormorant Garamond",Georgia,serif;color:#c27ba0}
.pg-soon p{margin:0;font-family:"Noto Serif TC",serif;font-size:13px;letter-spacing:.12em;color:#6b5e63;line-height:1.9}
.pg-soon a{font-family:"Noto Serif TC",serif;font-size:13px;letter-spacing:.12em;color:#3d3639;text-decoration:none;border-bottom:1px solid #c27ba0;padding-bottom:3px;margin-top:4px}
.gal-grid{columns:2;column-gap:10px;padding:4px 16px 30px}
.gal-grid button{display:block;width:100%;margin:0 0 10px;padding:0;border:0;background:#f7eef1;border-radius:5px;overflow:hidden;break-inside:avoid}
.gal-grid img{display:block;width:100%;height:auto}
.nw-filter{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 16px 14px}
.nw-filter button{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 "Noto Serif TC",serif;letter-spacing:.1em;color:#3d3639;background:none;border:1px solid #ecdfe3;border-radius:999px;padding:7px 12px}
.nw-filter button i{width:6px;height:6px;border-radius:50%}
.nw-list{list-style:none;margin:0 16px;padding:0;border-top:1px solid #ecdfe3}
.nw-item{border-bottom:1px solid #ecdfe3}
.nw-sum{width:100%;text-align:left;background:none;border:0;padding:16px 2px;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit}
.nw-top{display:flex;align-items:center;gap:8px}
.nw-date{font-family:"Cormorant Garamond",Georgia,serif;font-size:15px;color:#8a7d82;font-variant-numeric:tabular-nums}
.nw-cat{font:500 10px/1 "Noto Serif TC",serif;letter-spacing:.15em;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.nw-t{font-family:"Noto Serif TC",serif;font-weight:600;font-size:15px;line-height:1.5;color:#3d3639}
.nw-pin{font:italic 500 13px "Cormorant Garamond",serif;color:#c27ba0;margin-left:6px}
.nw-body{padding:0 2px 18px;font-family:"Noto Serif TC",serif;font-size:13px;line-height:1.9;color:#4f4649;white-space:pre-line}
.nw-empty{text-align:center;font-family:"Noto Serif TC",serif;font-size:13px;color:#8a7d82;margin:24px 0}
@media (prefers-reduced-motion:reduce){.mini-swing{animation:none}.mini-kick{transition:none!important}}

.mpill{transition:background .2s,transform .2s}
.mpill:not([aria-current]):hover{background:#fbdbe4 !important;transform:translateX(-3px) rotate(-2deg)}
@keyframes logobeat{0%,100%{transform:scale(1)}25%{transform:scale(1.28) rotate(-8deg)}50%{transform:scale(.92)}75%{transform:scale(1.15) rotate(6deg)}}

.logo-link{position:relative}
.logo-link .lg-h{position:relative;z-index:2;flex:none;transform-origin:50% 60%}
.lg-w{display:inline-block;margin-left:-4px}
.lg-t{display:inline-block;font-family:"La Belle Aurore",cursive;font-weight:400;color:#4f494c;letter-spacing:.02em;white-space:nowrap;filter:url(#pencilTex)}
.logo-link:hover{color:inherit !important}
.logo-link:hover .lg-h{animation:logobeat .7s ease-in-out}
@media (prefers-reduced-motion:reduce){.logo-link:hover .lg-h{animation:none}}

<style>html,body{margin:0;background:#fffdfb;overflow:hidden}#dcroot{margin:0 auto}template{display:none}
#pl{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--pl-bg,#fffdfb);transition:opacity .5s ease,visibility .5s}
#pl.done,.pl-quick #pl.pl-wait,.pl-quick #pl:not(.pl-show){opacity:0;visibility:hidden}.pl-quick #pl:not(.pl-show){transition:none}
.pl-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.pl-track{position:relative;width:300px;padding-top:52px}
.pl-bun{position:absolute;top:0;left:0;width:66px;margin-left:-33px;transform-origin:50% 100%;transition:left .2s ease-out;animation:plhop .34s ease-in-out infinite alternate;pointer-events:none}
.pl-bar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;padding:5px;border:2px solid #4f494c;border-radius:12px 9px 13px 8px;background:#fff;box-shadow:2px 3px 0 #f6c9d4}
.pl-bar i{display:block;height:14px;border-radius:3px 4px 3px 4px;background:#f6edf0}
.pl-bar i.on{background:#f6c9d4;box-shadow:inset 0 0 0 1.5px #e597b1;animation:plpop .26s ease-out}
.pl-t{font-family:"La Belle Aurore",cursive;font-size:26px;line-height:1.2;color:#4f494c;display:flex;align-items:baseline;gap:10px}
.pl-t b{font:600 13px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.08em;color:#c27ba0;font-variant-numeric:tabular-nums;min-width:3.2em}
@keyframes plpop{0%{transform:scaleY(.3)}60%{transform:scaleY(1.3)}100%{transform:none}}
@keyframes plhop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.pl-bun,.pl-bar i.on{animation:none}}
#pl{--pl-bg:#fffdfb}</style>

<script>


class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) { if (typeof o === 'function') o = o(this.state); Object.assign(this.state, o); }
  forceUpdate() {} }

var NEWS_URL = "/m/news", NEED = ["annc", "news"], SITE_DEF = { annc: {"on": true, "tag": "公告", "text": "Sceneey's Studio 新網站上線", "link": "news", "linkText": "看更多"} };
function siteCached(k) { try { var c = localStorage.getItem('site_' + k); return c ? JSON.parse(c) : null; } catch (e) { return null; } }
var SITE = { annc: siteCached('annc') || SITE_DEF.annc, news: NEED.indexOf('news') >= 0 ? siteCached('news') : null, gallery: NEED.indexOf('gallery') >= 0 ? siteCached('gallery') : null };
document.addEventListener('alpine:init', function () { SITE = Alpine.reactive(SITE);
  NEED.forEach(function (k) { fetch('/api/site?k=' + k, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.data != null) { SITE[k] = d.data; try { localStorage.setItem('site_' + k, JSON.stringify(d.data)); } catch (e) {} } }).catch(function () {}); }); });
function siteVals(r) { var a = SITE.annc || SITE_DEF.annc, l = a.link || 'news';
  r.site = { annc: { tag: a.tag || '公告', text: a.text || '', hasLink: l !== 'none', linkText: a.linkText || '看更多', href: l === 'none' ? null : (l === 'news' ? NEWS_URL : l) } };
  if (!a.on) { r.anncOpen = false; r.scTop = '0px'; } return r; }


class Component extends DCLogic {
  constructor(props) { super(props); this.state = { annc: true, menu: false, cat: '全部', open: null }; }
  renderVals() {
    const COL = { '全部': '#3d3639', '公告': '#c27ba0', '維修': '#8a9bb0', '圖片': '#9b8ac9', '花絮': '#d9a76a' };
    const data = (SITE.news || [
      { id: '2026-11-site-launch', date: '2026.11.07', cat: '公告', pin: true, title: "Sceneey's Studio 新網站上線", body: '全新的 Sceneey\'s Studio 正式上線了！這裡會整理角色設定集、世界觀與作品紀錄，之後的更新與消息也會在這裡公告。' }
    ]).slice().sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const cur = this.state.cat;
    const cats = ['全部', '公告', '維修', '圖片', '花絮'].map((name) => {
      const on = name === cur;
      return { name, col: name === '全部' ? 'transparent' : COL[name], pressed: on ? 'true' : 'false',
        style: on ? 'background: #3d3639; border-color: #3d3639; color: #ffffff' : '',
        pick: () => this.setState({ cat: name }) };
    });
    const items = data.filter((n) => cur === '全部' || n.cat === cur).map((n) => ({
      ...n, col: COL[n.cat], open: this.state.open === n.id, arrow: this.state.open === n.id ? 'open' : '',
      toggle: () => this.setState({ open: this.state.open === n.id ? null : n.id })
    }));
    return { onScroll: (e) => { const el = e.currentTarget; const k = el.querySelector('.mini-kick'); if (!k) return; const d = el.scrollTop - (this._lastY || 0); this._lastY = el.scrollTop; const a = Math.max(-14, Math.min(14, -d * 0.6)); k.style.transform = 'rotate(' + a + 'deg)'; clearTimeout(this._kt); this._kt = setTimeout(() => { k.style.transform = 'rotate(0deg)'; }, 120); }, anncOpen: this.state.annc, closeAnnc: () => this.setState({ annc: false }), scTop: this.state.annc ? '36px' : '0px', menuOpen: this.state.menu, toggleMenu: () => this.setState({ menu: !this.state.menu }), cats, items, empty: items.length === 0 };
  }
}


document.addEventListener('alpine:init', function () {
  Alpine.data('dcApp', function () {
    var c = new Component({});
    c.state = Alpine.reactive(c.state);
    return { init: function () { if (c.componentDidMount) c.componentDidMount(); }, get v() { return siteVals(c.renderVals()); } };
  });
});
