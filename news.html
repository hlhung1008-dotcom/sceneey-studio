<style>
.news{--ink:#3d3639;--soft:#8a7d82;--rule:#ecdfe3;--paper:#fffdfb}
.news{background:var(--paper);padding-bottom:80px}
.nw-head{max-width:760px;margin:0 auto;padding-block:64px 28px;text-align:center}
.nw-eyebrow{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;color:var(--soft);letter-spacing:.06em}
.nw-title{margin:4px 0 10px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:64px;line-height:1;letter-spacing:.18em;color:var(--ink)}
.nw-sub{margin:0;font-family:"Noto Serif TC",serif;font-size:14px;letter-spacing:.2em;color:var(--soft)}
.nw-filter{max-width:760px;margin:0 auto 18px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.nw-filter button{display:inline-flex;align-items:center;gap:7px;font:500 14px/1 "Noto Serif TC",serif;letter-spacing:.12em;color:var(--ink);background:none;border:1px solid var(--rule);border-radius:999px;padding:9px 18px;cursor:pointer;transition:background .2s,border-color .2s}
.nw-filter button i{width:7px;height:7px;border-radius:50%}
.nw-filter button:hover{border-color:#d8c4cb}
.nw-filter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.nw-filter button:focus-visible,.nw-item summary:focus-visible{outline:2px solid #c27ba0;outline-offset:3px}
.nw-list{list-style:none;max-width:760px;margin:0 auto;padding-top:0;padding-bottom:0;border-top:1px solid var(--rule)}
.nw-item{border-bottom:1px solid var(--rule)}
.nw-item summary{list-style:none;display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:baseline;gap:18px;padding:22px 4px;cursor:pointer}
.nw-item summary::-webkit-details-marker{display:none}
.nw-date{font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;color:var(--soft);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.nw-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.nw-cat{align-self:flex-start;font:500 11px/1 "Noto Serif TC",serif;letter-spacing:.2em;padding:4px 10px;border-radius:999px;border:1px solid currentColor}
.nw-t{font-family:"Noto Serif TC",serif;font-weight:600;font-size:18px;line-height:1.5;color:var(--ink)}
.nw-pin{font:italic 500 14px "Cormorant Garamond",serif;color:#c27ba0;margin-left:8px}
.nw-arrow{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--soft);transition:transform .3s}
.nw-item[open] .nw-arrow{transform:rotate(90deg)}
.nw-body{padding:0 4px 26px 132px;font-family:"Noto Serif TC",serif;font-size:15px;line-height:2;color:#4f4649;white-space:pre-line}
.nw-body img{display:block;max-width:100%;border-radius:4px;margin-top:14px}
.nw-body a{color:#c27ba0}
.nw-empty{max-width:760px;margin:30px auto 0;text-align:center;font-family:"Noto Serif TC",serif;color:var(--soft);letter-spacing:.1em}
@media (max-width:640px){.nw-title{font-size:46px}.nw-item summary{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}.nw-date{grid-column:1/-1}.nw-body{padding-left:4px}}
</style>
<script>
(function(){
  var COL={'公告':'#c27ba0','維修':'#8a9bb0','圖片':'#9b8ac9','花絮':'#d9a76a'};
  var list=document.getElementById('nwList'),empty=document.getElementById('nwEmpty'),btns=document.querySelectorAll('.nw-filter button'),data=[];
  function render(cat){
    list.textContent='';
    var items=data.filter(function(n){return cat==='全部'||n.cat===cat;});
    empty.hidden=items.length>0;
    items.forEach(function(n){
      var li=document.createElement('li');li.className='nw-item';li.id=n.id;
      var d=document.createElement('details');if(location.hash==='#'+n.id)d.open=true;
      var sm=document.createElement('summary');
      var dt=document.createElement('span');dt.className='nw-date';dt.textContent=n.date.replace(/-/g,'.');
      var mn=document.createElement('span');mn.className='nw-main';
      var ct=document.createElement('span');ct.className='nw-cat';ct.textContent=n.cat;ct.style.color=COL[n.cat]||'#8a7d82';
      var tt=document.createElement('span');tt.className='nw-t';tt.textContent=n.title;
      if(n.pin){var p=document.createElement('span');p.className='nw-pin';p.textContent='pinned';tt.appendChild(p);}
      mn.append(ct,tt);
      var ar=document.createElement('span');ar.className='nw-arrow';ar.setAttribute('aria-hidden','true');ar.textContent='›';
      sm.append(dt,mn,ar);
      var bd=document.createElement('div');bd.className='nw-body';bd.textContent=n.body||'';
      if(n.image){var im=document.createElement('img');im.src=n.image;im.alt=n.title;im.loading='lazy';bd.appendChild(im);}
      if(n.link){var a=document.createElement('a');a.href=n.link;a.target='_blank';a.rel='noopener';a.textContent='查看原文 →';a.style.display='inline-block';a.style.marginTop='10px';bd.appendChild(a);}
      d.append(sm,bd);li.appendChild(d);list.appendChild(li);
    });
  }
  btns.forEach(function(b){b.addEventListener('click',function(){btns.forEach(function(x){x.setAttribute('aria-pressed',x===b);});render(b.dataset.cat);});});
  fetch('news.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(j){
    data=j.slice().sort(function(a,b){if(!!b.pin!==!!a.pin)return b.pin?1:-1;return a.date<b.date?1:-1;});render('全部');
    if(location.hash){var t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView({block:'center'});}
  }).catch(function(){empty.hidden=false;empty.textContent='公告暫時無法載入，請稍後再試。';});
})();
</script>
