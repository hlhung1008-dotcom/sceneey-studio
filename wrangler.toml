name = "sceneey-studio"
main = "worker/index.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
# HTML pages go through the worker so it can add link-preview (Open Graph) tags; images/js stay direct.
run_worker_first = ["/", "/index.html", "/news*", "/world*", "/characters*", "/story*", "/gallery*", "/qa*", "/armentary*", "/maroplis*", "/wujie*", "/m", "/m/*"]

[[d1_databases]]
binding = "DB"
database_name = "sceneey-studio"
database_id = "81c95a81-e96e-4b21-8017-a4d3e5fc953a"

[observability]
enabled = true
